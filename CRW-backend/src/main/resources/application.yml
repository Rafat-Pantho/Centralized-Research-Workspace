server:
  port: 8081

spring:
  application:
    name: crw-backend
  datasource:
    url: jdbc:h2:file:./data/crwdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:pGOl5iKwAOn0RMJGYRpflgqkAKjopoKoz5i0IP9HIF+9Z+JtKj+kKUO7z6dDMFl4rXOBU+xYfZwot1Uq262SfQ==}
    expiration-ms: 86400000
